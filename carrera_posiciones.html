<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuervos Mundialistas 🦅</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f8f8f6; color: #1a1a1a; padding: 1.5rem; }

  /* Header */
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 20px; font-weight: 500; }
  .subtitle { font-size: 13px; color: #888; margin-top: 2px; }
  .date-pill { font-size: 12px; color: #555; background: white; padding: 4px 12px; border-radius: 20px; border: 1px solid #e0e0e0; }

  /* Tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 1.25rem; border-bottom: 2px solid #e8e8e6; overflow-x: auto; }
  .tab { font-size: 14px; padding: 8px 18px; cursor: pointer; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none; white-space: nowrap; }
  .tab:hover { color: #1a1a1a; }
  .tab.active { color: #1a1a1a; font-weight: 500; border-bottom: 2px solid #1a1a1a; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* Posiciones */
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .play-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 16px; border-radius: 8px; border: 1px solid #ddd; background: white; cursor: pointer; font-weight: 500; }
  .play-btn:hover { background: #f0f0ee; }
  .timeline { display: flex; gap: 6px; flex-wrap: wrap; }
  .dbtn { font-size: 12px; padding: 4px 10px; border-radius: 8px; border: 1px solid #e0e0e0; background: white; color: #888; cursor: pointer; transition: all 0.15s; }
  .dbtn.active { background: #1a1a1a; color: white; border-color: #1a1a1a; font-weight: 500; }
  .chart-area { background: white; border-radius: 12px; padding: 1.25rem; border: 1px solid #eee; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; height: 38px; }
  .rank { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; }
  .name { width: 62px; font-size: 13px; font-weight: 500; text-align: right; flex-shrink: 0; color: #1a1a1a; }
  .bar-wrap { flex: 1; height: 30px; background: #f0f0ee; border-radius: 7px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 7px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; transition: width 0.75s cubic-bezier(.4,0,.2,1); min-width: 44px; }
  .bar-pts { font-size: 12px; font-weight: 500; }
  .mover { font-size: 11px; font-weight: 600; min-width: 28px; text-align: center; flex-shrink: 0; }
  .mover.up { color: #1D9E75; }
  .mover.down { color: #D85A30; }
  .mover.same { color: #aaa; }
  .pjd { font-size: 11px; color: #999; min-width: 36px; text-align: right; flex-shrink: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #f0f0ee; }
  .li { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #666; }
  .ld { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* Nacionalidades */
  .nac-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .nac-card { background: white; border-radius: 12px; border: 1px solid #eee; padding: 1.25rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .nac-bandera { font-size: 48px; line-height: 1; }
  .nac-nombre { font-size: 15px; font-weight: 500; color: #1a1a1a; }
  .nac-pais { font-size: 13px; color: #555; }
  .nac-puntos { font-size: 12px; color: #999; }
  .nac-doble { font-size: 11px; color: #888; line-height: 1.4; }
  .nac-sin { font-size: 13px; color: #bbb; }
  .nac-actualizado { font-size: 12px; color: #aaa; margin-bottom: 1rem; }

  /* Disputados */
  .dis-intro { font-size: 13px; color: #666; margin-bottom: 1rem; line-height: 1.6; }
  .dis-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 1rem; }
  .dis-badge { font-size: 12px; background: white; border: 1px solid #e0e0e0; border-radius: 20px; padding: 4px 12px; color: #555; }
  .dis-badge b { color: #1a1a1a; }
  .omit-box { font-size: 12px; color: #999; background: white; border: 1px solid #eee; border-radius: 10px; padding: 10px 14px; margin-bottom: 1.5rem; line-height: 1.7; }
  .omit-box strong { color: #555; font-weight: 600; display: block; margin-bottom: 4px; }
  .dis-groups { display: flex; flex-direction: column; gap: 1.5rem; }
  .dis-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .dis-group-tag { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: #1a1a1a; color: white; padding: 3px 10px; border-radius: 6px; }
  .dis-group-sub { font-size: 12px; color: #aaa; }
  .dis-team { background: white; border: 1px solid #eee; border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; }
  .dis-team-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .dis-count { font-size: 28px; font-weight: 700; color: #1a1a1a; min-width: 52px; line-height: 1; }
  .dis-count small { display: block; font-size: 10px; font-weight: 500; letter-spacing: .1em; color: #aaa; text-transform: uppercase; margin-top: 2px; }
  .dis-team-name { font-size: 18px; font-weight: 600; flex: 1; }
  .dis-bar-bg { height: 4px; background: #f0f0ee; border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
  .dis-bar-fill { height: 100%; border-radius: 4px; background: #1a1a1a; transition: width 0.5s ease; }
  .dis-perch { display: flex; flex-wrap: wrap; gap: 6px; }
  .dis-slot { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 7px; border-radius: 999px; font-size: 12px; border: 1px solid #e8e8e6; }
  .dis-slot .dis-mark { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dis-slot.voted { background: #f0faf6; border-color: #b6e8d4; color: #1a1a1a; }
  .dis-slot.voted .dis-mark { background: #1D9E75; }
  .dis-slot.no { color: #ccc; border-style: dashed; }
  .dis-slot.no .dis-mark { background: #e0e0e0; }
  .dis-slot.no .dis-nm { text-decoration: line-through; text-decoration-color: #ddd; }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>Cuervos Mundialistas 🦅</h1>
    <p class="subtitle">Mundial 2026</p>
  </div>
  <span class="date-pill" id="date-pill">—</span>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('posiciones', this)">🏆 Posiciones</button>
  <button class="tab"        onclick="switchTab('nacionalidades', this)">🌍 Nacionalidades</button>
  <button class="tab"        onclick="switchTab('disputados', this)">⚔️ Disputados</button>
</div>

<!-- Panel: Posiciones -->
<div class="panel active" id="panel-posiciones">
  <div class="controls">
    <button class="play-btn" id="play-btn" onclick="togglePlay()">▶ Animar</button>
    <div class="timeline" id="timeline"></div>
  </div>
  <div class="chart-area">
    <div id="chart"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<!-- Panel: Nacionalidades -->
<div class="panel" id="panel-nacionalidades">
  <p class="nac-actualizado">Actualizado: 2026-06-15 12:42</p>
  <div class="nac-grid" id="nac-grid"></div>
</div>

<!-- Panel: Disputados -->
<div class="panel" id="panel-disputados">
  <p class="dis-intro">Los equipos con <strong>8/8 votos</strong> (unánimes) están omitidos. Aquí solo los <strong>disputados</strong>: entre 1 y 7 votos. Los cuervos iluminados en verde votaron por el equipo.</p>
  <div class="dis-meta">
    <span class="dis-badge">Cuervos: <b id="ptotal"></b></span>
    <span class="dis-badge">Equipos disputados: <b id="dtotal"></b></span>
  </div>
  <div class="omit-box">
    <strong>Omitidos por unanimidad (8/8):</strong>
    <span id="omitlist"></span>
  </div>
  <div class="dis-groups" id="dis-groups"></div>
</div>

<script>
const DATA        = [{"fecha": "2026-06-11", "posiciones": [{"Posicion": 1, "Nombre": "Luisa", "Puntos": 12, "Partidos_Jugados": 2}, {"Posicion": 1, "Nombre": "Laura", "Puntos": 12, "Partidos_Jugados": 2}, {"Posicion": 1, "Nombre": "Andrea", "Puntos": 12, "Partidos_Jugados": 2}, {"Posicion": 1, "Nombre": "Jose", "Puntos": 12, "Partidos_Jugados": 2}, {"Posicion": 1, "Nombre": "Thomas", "Puntos": 12, "Partidos_Jugados": 2}, {"Posicion": 1, "Nombre": "David", "Puntos": 12, "Partidos_Jugados": 2}, {"Posicion": 7, "Nombre": "Diego", "Puntos": 9, "Partidos_Jugados": 2}, {"Posicion": 8, "Nombre": "Sergio", "Puntos": 3, "Partidos_Jugados": 2}]}, {"fecha": "2026-06-12", "posiciones": [{"Posicion": 1, "Nombre": "Andrea", "Puntos": 24, "Partidos_Jugados": 4}, {"Posicion": 2, "Nombre": "Laura", "Puntos": 21, "Partidos_Jugados": 4}, {"Posicion": 2, "Nombre": "David", "Puntos": 21, "Partidos_Jugados": 4}, {"Posicion": 4, "Nombre": "Sergio", "Puntos": 20, "Partidos_Jugados": 4}, {"Posicion": 5, "Nombre": "Thomas", "Puntos": 18, "Partidos_Jugados": 4}, {"Posicion": 5, "Nombre": "Jose", "Puntos": 18, "Partidos_Jugados": 4}, {"Posicion": 7, "Nombre": "Luisa", "Puntos": 15, "Partidos_Jugados": 4}, {"Posicion": 8, "Nombre": "Diego", "Puntos": 12, "Partidos_Jugados": 4}]}, {"fecha": "2026-06-13", "posiciones": [{"Posicion": 1, "Nombre": "Andrea", "Puntos": 44, "Partidos_Jugados": 7}, {"Posicion": 2, "Nombre": "Thomas", "Puntos": 38, "Partidos_Jugados": 6}, {"Posicion": 3, "Nombre": "David", "Puntos": 33, "Partidos_Jugados": 7}, {"Posicion": 3, "Nombre": "Laura", "Puntos": 33, "Partidos_Jugados": 7}, {"Posicion": 5, "Nombre": "Jose", "Puntos": 27, "Partidos_Jugados": 7}, {"Posicion": 6, "Nombre": "Sergio", "Puntos": 26, "Partidos_Jugados": 7}, {"Posicion": 7, "Nombre": "Luisa", "Puntos": 24, "Partidos_Jugados": 7}, {"Posicion": 8, "Nombre": "Diego", "Puntos": 21, "Partidos_Jugados": 7}]}, {"fecha": "2026-06-14", "posiciones": [{"Posicion": 1, "Nombre": "Andrea", "Puntos": 65, "Partidos_Jugados": 12}, {"Posicion": 2, "Nombre": "Luisa", "Puntos": 47, "Partidos_Jugados": 12}, {"Posicion": 3, "Nombre": "Laura", "Puntos": 45, "Partidos_Jugados": 12}, {"Posicion": 3, "Nombre": "David", "Puntos": 45, "Partidos_Jugados": 12}, {"Posicion": 5, "Nombre": "Thomas", "Puntos": 44, "Partidos_Jugados": 11}, {"Posicion": 6, "Nombre": "Jose", "Puntos": 36, "Partidos_Jugados": 12}, {"Posicion": 6, "Nombre": "Diego", "Puntos": 36, "Partidos_Jugados": 12}, {"Posicion": 8, "Nombre": "Sergio", "Puntos": 35, "Partidos_Jugados": 12}]}, {"fecha": "2026-06-15", "posiciones": [{"Posicion": 1, "Nombre": "Andrea", "Puntos": 65, "Partidos_Jugados": 12}, {"Posicion": 2, "Nombre": "Luisa", "Puntos": 47, "Partidos_Jugados": 12}, {"Posicion": 3, "Nombre": "Laura", "Puntos": 45, "Partidos_Jugados": 12}, {"Posicion": 3, "Nombre": "David", "Puntos": 45, "Partidos_Jugados": 12}, {"Posicion": 5, "Nombre": "Thomas", "Puntos": 44, "Partidos_Jugados": 11}, {"Posicion": 6, "Nombre": "Jose", "Puntos": 36, "Partidos_Jugados": 12}, {"Posicion": 6, "Nombre": "Diego", "Puntos": 36, "Partidos_Jugados": 12}, {"Posicion": 8, "Nombre": "Sergio", "Puntos": 35, "Partidos_Jugados": 12}]}];
const COLORS      = {"Laura": {"fill": "#5DCAA5", "text": "#085041"}, "Andrea": {"fill": "#7F77DD", "text": "#26215C"}, "Jose": {"fill": "#378ADD", "text": "#042C53"}, "David": {"fill": "#D85A30", "text": "#4A1B0C"}, "Luisa": {"fill": "#D4537E", "text": "#4B1528"}, "Thomas": {"fill": "#639922", "text": "#173404"}, "Diego": {"fill": "#BA7517", "text": "#412402"}, "Sergio": {"fill": "#888780", "text": "#2C2C2A"}};
const NAC         = {"actualizado": "2026-06-15 12:42", "cuervos": [{"nombre": "Luisa", "nacionalidades": [{"pais": "Países Bajos", "bandera": "🇳🇱", "puntos": 11}], "puntos_max": 11, "sin_datos": false}, {"nombre": "Laura", "nacionalidades": [{"pais": "Escocia", "bandera": "🏴󠁧󠁢󠁳󠁣󠁴󠁿", "puntos": 6}, {"pais": "México", "bandera": "🇲🇽", "puntos": 6}], "puntos_max": 6, "sin_datos": false}, {"nombre": "Andrea", "nacionalidades": [{"pais": "Catar", "bandera": "🇶🇦", "puntos": 11}], "puntos_max": 11, "sin_datos": false}, {"nombre": "Jose", "nacionalidades": [{"pais": "México", "bandera": "🇲🇽", "puntos": 6}], "puntos_max": 6, "sin_datos": false}, {"nombre": "Thomas", "nacionalidades": [{"pais": "Brasil", "bandera": "🇧🇷", "puntos": 11}], "puntos_max": 11, "sin_datos": false}, {"nombre": "David", "nacionalidades": [{"pais": "Canadá", "bandera": "🇨🇦", "puntos": 6}, {"pais": "Escocia", "bandera": "🏴󠁧󠁢󠁳󠁣󠁴󠁿", "puntos": 6}, {"pais": "México", "bandera": "🇲🇽", "puntos": 6}], "puntos_max": 6, "sin_datos": false}, {"nombre": "Diego", "nacionalidades": [{"pais": "México", "bandera": "🇲🇽", "puntos": 6}], "puntos_max": 6, "sin_datos": false}, {"nombre": "Sergio", "nacionalidades": [{"pais": "Estados Unidos", "bandera": "🇺🇸", "puntos": 11}], "puntos_max": 11, "sin_datos": false}]};
const DISPUTADOS  = {"participants": ["Diego", "David", "Morrigan", "jose", "Andrea", "Laura", "Thom", "Sergio"], "groups": [{"group": "Grupo A", "teams": [{"team": "Corea del Sur", "count": 6, "voters": ["Diego", "David", "Morrigan", "jose", "Andrea", "Thom"]}, {"team": "Chequia", "count": 3, "voters": ["Diego", "David", "Thom"]}, {"team": "Surafrica", "count": 3, "voters": ["Andrea", "Laura", "Sergio"]}]}, {"group": "Grupo B", "teams": [{"team": "Canada", "count": 7, "voters": ["Diego", "David", "jose", "Andrea", "Laura", "Thom", "Sergio"]}, {"team": "Suiza", "count": 6, "voters": ["Diego", "David", "Morrigan", "jose", "Andrea", "Thom"]}, {"team": "Qatar", "count": 5, "voters": ["Morrigan", "Andrea", "Laura", "Thom", "Sergio"]}, {"team": "Bosnia", "count": 4, "voters": ["Diego", "David", "Morrigan", "jose"]}]}, {"group": "Grupo C", "teams": [{"team": "Marruecos", "count": 7, "voters": ["Diego", "David", "Morrigan", "jose", "Andrea", "Thom", "Sergio"]}, {"team": "Escocia", "count": 5, "voters": ["Diego", "Morrigan", "jose", "Thom", "Sergio"]}, {"team": "Haiti", "count": 2, "voters": ["Andrea", "Laura"]}]}, {"group": "Grupo D", "teams": [{"team": "Turquia", "count": 6, "voters": ["Diego", "David", "Morrigan", "jose", "Andrea", "Laura"]}, {"team": "Paraguay", "count": 4, "voters": ["jose", "Andrea", "Thom", "Sergio"]}, {"team": "Australia", "count": 3, "voters": ["Laura", "Thom", "Sergio"]}]}, {"group": "Grupo E", "teams": [{"team": "Costa de Marfil", "count": 6, "voters": ["Diego", "David", "Morrigan", "Andrea", "Laura", "Thom"]}]}, {"group": "Grupo F", "teams": [{"team": "Suecia", "count": 7, "voters": ["Diego", "David", "Morrigan", "jose", "Andrea", "Laura", "Sergio"]}]}, {"group": "Grupo G", "teams": [{"team": "Egipto", "count": 6, "voters": ["Diego", "David", "Morrigan", "Laura", "Thom", "Sergio"]}, {"team": "Nueva Zelanda", "count": 4, "voters": ["jose", "Andrea", "Laura", "Sergio"]}, {"team": "Iran", "count": 3, "voters": ["Morrigan", "jose", "Thom"]}]}, {"group": "Grupo H", "teams": [{"team": "Arabia Saudi", "count": 3, "voters": ["Morrigan", "Laura", "Sergio"]}]}, {"group": "Grupo I", "teams": [{"team": "Senegal", "count": 7, "voters": ["Diego", "David", "Morrigan", "Andrea", "Laura", "Thom", "Sergio"]}]}, {"group": "Grupo J", "teams": [{"team": "Austria", "count": 6, "voters": ["Diego", "David", "jose", "Andrea", "Laura", "Sergio"]}, {"team": "Argelia", "count": 3, "voters": ["David", "jose", "Andrea"]}, {"team": "Jordania", "count": 3, "voters": ["Morrigan", "Thom", "Sergio"]}]}, {"group": "Grupo K", "teams": [{"team": "RD Congo", "count": 6, "voters": ["Diego", "David", "Morrigan", "jose", "Laura", "Sergio"]}]}, {"group": "Grupo L", "teams": [{"team": "Croacia", "count": 7, "voters": ["Diego", "David", "Morrigan", "jose", "Andrea", "Laura", "Thom"]}, {"team": "Ghana", "count": 4, "voters": ["Diego", "David", "jose", "Thom"]}, {"team": "Panama", "count": 2, "voters": ["Laura", "Sergio"]}]}], "omitted": ["Mexico", "Brasil", "USA", "Alemania", "Ecuador", "Paises Bajos", "Japón", "Belgica", "España", "Uruguay", "Francia", "Noruega", "Argentina", "Portugal", "Colombia", "Inglaterra"]};

let day = 0, playing = false, iv = null;

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById("panel-" + name).classList.add("active");
  btn.classList.add("active");
}

// ── Posiciones ────────────────────────────────────────────────────────────────
function fmt(s) {
  const [y,m,d] = s.split("-");
  const ms = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return `${parseInt(d)} ${ms[parseInt(m)-1]} ${y}`;
}
function prevPos(nombre, dayIdx) {
  if (dayIdx === 0) return null;
  const p = DATA[dayIdx-1].posiciones.find(p => p.Nombre === nombre);
  return p ? p.Posicion : null;
}
function medalFor(pos) {
  if (pos === 1) return { icon: "🥇", bg: "#FAC775" };
  if (pos === 2) return { icon: "🥈", bg: "#D3D1C7" };
  if (pos === 3) return { icon: "🥉", bg: "#F0997B" };
  return { icon: `#${pos}`, bg: "#f0f0ee" };
}
function moverHTML(curr, prev) {
  if (prev === null) return '<span class="mover same">—</span>';
  const d = prev - curr;
  if (d > 0) return `<span class="mover up">▲${d}</span>`;
  if (d < 0) return `<span class="mover down">▼${Math.abs(d)}</span>`;
  return '<span class="mover same">—</span>';
}
function render(idx) {
  const snap = DATA[idx];
  const maxP = Math.max(...snap.posiciones.map(p => p.Puntos), 1);
  document.getElementById("date-pill").textContent = fmt(snap.fecha);
  const sorted = [...snap.posiciones].sort((a,b) => b.Puntos - a.Puntos);
  document.getElementById("chart").innerHTML = sorted.map((p) => {
    const c    = COLORS[p.Nombre] || { fill:"#B4B2A9", text:"#2C2C2A" };
    const pct  = Math.max(Math.round((p.Puntos / maxP) * 100), 5);
    const m    = medalFor(p.Posicion);
    const prev = prevPos(p.Nombre, idx);
    return `<div class="bar-row">
      <span class="rank" style="background:${m.bg}">${m.icon}</span>
      <span class="name">${p.Nombre}</span>
      <div class="bar-wrap">
        <div class="bar-fill" style="width:${pct}%;background:${c.fill}">
          <span class="bar-pts" style="color:${c.text}">${p.Puntos}pts</span>
        </div>
      </div>
      ${moverHTML(p.Posicion, prev)}
      <span class="pjd">${p.Partidos_Jugados}P</span>
    </div>`;
  }).join("");
  document.getElementById("legend").innerHTML = Object.entries(COLORS).map(([n,c]) =>
    `<span class="li"><span class="ld" style="background:${c.fill}"></span>${n}</span>`
  ).join("");
  renderTL();
}
function renderTL() {
  document.getElementById("timeline").innerHTML = DATA.map((d,i) =>
    `<button class="dbtn${i===day?" active":""}" onclick="goTo(${i})">${fmt(d.fecha)}</button>`
  ).join("");
}
function goTo(i) { day = i; render(i); }
function togglePlay() {
  playing = !playing;
  const btn = document.getElementById("play-btn");
  if (playing) {
    btn.textContent = "⏸ Pausar";
    iv = setInterval(() => {
      day = (day + 1) % DATA.length;
      render(day);
      if (day === DATA.length - 1) {
        playing = false;
        btn.textContent = "▶ Animar";
        clearInterval(iv);
      }
    }, 1400);
  } else {
    btn.textContent = "▶ Animar";
    clearInterval(iv);
  }
}

// ── Nacionalidades ────────────────────────────────────────────────────────────
function renderNac() {
  document.getElementById("nac-grid").innerHTML = NAC.cuervos.map(c => {
    if (c.sin_datos) {
      return `<div class="nac-card">
        <span class="nac-bandera">🏳️</span>
        <span class="nac-nombre">${c.nombre}</span>
        <span class="nac-sin">Sin nacionalidad aún</span>
      </div>`;
    }
    const banderas = c.nacionalidades.map(n => n.bandera).join(" ");
    const paises   = c.nacionalidades.map(n => n.pais).join(" & ");
    const esDoble  = c.nacionalidades.length > 1;
    return `<div class="nac-card">
      <span class="nac-bandera">${banderas}</span>
      <span class="nac-nombre">${c.nombre}</span>
      <span class="nac-pais">${paises}</span>
      <span class="nac-puntos">${c.puntos_max} pts</span>
      ${esDoble ? '<span class="nac-doble">Doble nacionalidad 🌍</span>' : ''}
    </div>`;
  }).join("");
}

// ── Disputados ────────────────────────────────────────────────────────────────
function renderDisputados() {
  const order = DISPUTADOS.participants;
  const total = order.length;
  document.getElementById("ptotal").textContent  = total;
  document.getElementById("omitlist").textContent = DISPUTADOS.omitted.join(" · ");

  let disputed = 0;
  const wrap = document.getElementById("dis-groups");

  DISPUTADOS.groups.forEach(g => {
    if (!g.teams.length) return;
    const letter   = g.group.split(" ").pop();
    const teamWord = g.teams.length === 1 ? "equipo" : "equipos";
    const sec      = document.createElement("section");
    sec.innerHTML  = `<div class="dis-group-head">
      <span class="dis-group-tag">Grupo ${letter}</span>
      <span class="dis-group-sub">${g.teams.length} ${teamWord} disputado${g.teams.length>1?"s":""}</span>
    </div>`;

    g.teams.forEach(t => {
      disputed++;
      const voters = new Set(t.voters);
      const pct    = Math.round((t.count / total) * 100);
      const perch  = order.map(n => {
        const v = voters.has(n);
        return `<span class="dis-slot ${v?"voted":"no"}">
          <span class="dis-mark"></span>
          <span class="dis-nm">${n}</span>
        </span>`;
      }).join("");

      const div = document.createElement("div");
      div.className = "dis-team";
      div.innerHTML = `
        <div class="dis-team-top">
          <div class="dis-count">${t.count}<small>de ${total}</small></div>
          <div class="dis-team-name">${t.team}</div>
        </div>
        <div class="dis-bar-bg"><div class="dis-bar-fill" style="width:${pct}%"></div></div>
        <div class="dis-perch">${perch}</div>`;
      sec.appendChild(div);
    });
    wrap.appendChild(sec);
  });

  document.getElementById("dtotal").textContent = disputed;
}

render(0);
renderNac();
renderDisputados();
</script>
